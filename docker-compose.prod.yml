version: "3"

services:
  server:
    image: groupevert/wns-deploy-server
    command: sh -c "npm run build && npm run startprod"
    expose:
      - 5000
    environment:
      - NODE_ENV=production
      - SERVER_PORT=5000
    depends_on:
      - db
  client:
    # build: ./client
    # To replace with the correct path of your client image
    image: groupevert/wns-deploy-client
    command: sh -c "npm run build"
    volumes:
      - ./frontend/src:/app/src

    environment:
      - NODE_ENV=production
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:1.21.3
    depends_on:
      - server
      - client
    restart: always
    ports:
      - ${GATEWAY_PORT}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
volumes:
  web-client-build:
  pgdata:
